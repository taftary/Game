name: Rust documentation

on:
  push:
    branches: [main, master]
    paths:
      - "crates/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "README.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "assets/**"
  pull_request:
    paths:
      - "crates/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "README.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "assets/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run workspace tests and headless examples
        run: cargo test --workspace --all-targets --locked

      - name: Run doc tests
        run: cargo test --doc --workspace --locked

  headless-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Cache mdbook
        uses: actions/cache@v4
        with:
          path: target/mdbook
          key: mdbook-${{ hashFiles('docs/.mdbook-version') }}

      - name: Build handbook and check links
        run: docs/scripts/check-book.sh

  gpu-and-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Compile-check GPU example
        run: cargo check --example viewer --features gpu --locked

      # Running the viewer requires a Vulkan-capable display. Add this step on a
      # runner that provides one, or replace the job with a self-hosted GPU runner.
      # - name: Run GPU example
      #   run: cargo run --example viewer --features gpu
